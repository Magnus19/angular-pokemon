<section class="menu-section">
  <h2
    style="
      font-size: 5rem;
      color: violet;
      border: black 2px solid;
      border-radius: 2rem;
      padding: 2rem;
      background-color: white;
    "
  >
    Hoenn Region Gym Leaders
  </h2>
  <div class="announcement-box">
    <h3>A message to all trainers!</h3>
    <p>{{ activeMonologue() }}</p>
  </div>

  <div class="card-grid">
    @for (item of hoennleaders(); track item.name) {
      <app-leader-info
        [name]="item.name"
        [age]="item.age"
        [location]="item.location"
        [badge]="item.badge"
        [specialty]="item.specialty"
        [gym]="item.gym"
        [pokemonTeam]="item.pokemonTeam"
        [monologue]="item.monologue"
        (monologueSelected)="onMonologueReceived($event)"
      >
      </app-leader-info>
    }
  </div>
</section>
